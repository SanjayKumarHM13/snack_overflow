services:
  # -----------------------------------------------------------------
  # PostgreSQL 18 Relational Database
  # -----------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: snack_overflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env.docker}
      # PostgreSQL 18 uses version-specific directory /var/lib/postgresql/18/docker
      PGDATA: ${PGDATA:-/var/lib/postgresql/18/docker}
    # ports:
    #   # PostgreSQL is isolated to the container network by default.
    #   # Uncomment below only if external host database access (e.g. pgAdmin/DBeaver) is explicitly required:
    #   - "5433:5432"
    volumes:
      # Mount /var/lib/postgresql parent directory for PostgreSQL 18 version-specific layout
      - snack_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - snack-network

  # -----------------------------------------------------------------
  # Ephemeral Database Migration Runner (Prisma)
  # -----------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    container_name: snack_overflow_migration
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.docker}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - snack-network

  # -----------------------------------------------------------------
  # Express.js REST API Backend
  # -----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runner
    container_name: snack_overflow_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.docker}
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.docker}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_NAME: ${COOKIE_NAME:-snack_session}
      ENABLE_MEMBER_REGISTRATION: ${ENABLE_MEMBER_REGISTRATION:-true}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - snack-network

  # -----------------------------------------------------------------
  # Next.js 15 Web Application Frontend
  # -----------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: snack_overflow_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - snack-network

# -----------------------------------------------------------------
# Networks & Volumes
# -----------------------------------------------------------------
networks:
  snack-network:
    driver: bridge
    name: snack-overflow-bridge

volumes:
  snack_postgres_data:
    name: snack_overflow_postgres_data
